name: EYMEN GELİR · Android Debug APK
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android platform
        run: |
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$sdk" ]; then echo "SDK manager not found"; exit 1; fi
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EYMEN-GELIR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
