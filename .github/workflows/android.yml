name: EYMEN GELİR · Kod ve Release Derleme Kontrolü

# Kontroller test varyantını kullanabilir; debug APK hiçbir zaman indirme olarak yayımlanmaz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kaynak kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" "platforms;android-36" "build-tools;36.0.0"
      - name: Birim testleri
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Sadece release derlemesinin doğrulanması
        run: gradle --no-daemon :app:assembleRelease
      - name: Yayımlama politikası
        run: |
          echo "Doğrulama tamamlandı. Bu workflow APK dağıtmaz."
          echo "Dağıtım yalnızca imzalı GitHub Releases üzerinden yapılır."
